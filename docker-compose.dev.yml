services:
  api:
    build:
      context: ./api
      dockerfile: Dockerfile.dev
      args:
        - NODE_ENVIRONMENT=development
        - PNPM_VERSION=9.12.0
    image: shop-api:latest
    hostname: shop-api
    restart: unless-stopped
    env_file:
      - ./api/.env.development
    ports:
      - ${API_PORT}:${API_PORT}
    # entrypoint: docker-entrypoint.sh
    networks:
      - backend-net
      - cache-net
    depends_on:
      shop-db:
        condition: service_healthy
    # command: ["pnpm", "run", "start:dev"]

  shop-db:
    image: postgres:16-alpine
    environment:
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_DB=shopp_db
    expose:
      - 5432
    networks:
      backend-net:
        aliases:
          - database
      admin-net:
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -p 5432"]
      interval: 1s
      timeout: 1s
      retries: 5
      start_period: 5s

  redis:
    image: redis:7-alpine
    hostname: shop-redis
    restart: unless-stopped
    networks:
      - cache-net
    ports:
      - ${REDIS_PORT}:${REDIS_PORT} # for dev using port would be better than using expose
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}"]

  admin:
    image: adminer:latest
    ports:
      - 8080:8080
    networks:
      - admin-net

volumes:
  pgdata:

networks:
  backend-net:
  admin-net:
  cache-net:
