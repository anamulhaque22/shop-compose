x-default-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "30M"
    max-file: "3"

services:
  api:
    image: ${IMAGE}
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    read_only: true
    tmpfs:
      - /tmp
    environment:
      PORT: ${PORT}
    env_file:
      - .env.production
    deploy:
      resources:
        limits:
          memory: "1G"
          cpus: "1.0"
        reservations:
          memory: "512M"
          cpus: "0.5"
    logging: *default-logging
    expose:
      - ${PORT}

  certbot:
    image: certbot/certbot
    volumes:
      - certbot-webroot:/var/www/certbot
      - certbot-certs:/etc/letsencrypt
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"
