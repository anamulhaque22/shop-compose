name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm + Node
        uses: pnpm/setup@v2
        with:
          version: 11
          runtime: node@22
          cache: true
          cache-dependency-path: api/pnpm-lock.yaml
          install: false

      - name: Install dependencies
        working-directory: ./api
        run: pnpm install --frozen-lockfile

      - name: Run tests
        run: pnpm test
        working-directory: ./api
        env:
          NODE_ENV: test

  lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm + Node
        uses: pnpm/setup@v2
        with:
          version: 11
          runtime: node@22
          cache: true
          cache-dependency-path: api/pnpm-lock.yaml
          install: false

      - name: Install dependencies
        working-directory: ./api
        run: pnpm install --frozen-lockfile

      - name: Run lint
        working-directory: ./api
        run: pnpm run lint

  type-check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm + Node
        uses: pnpm/setup@v2
        with:
          version: 11
          runtime: node@22
          cache: true
          cache-dependency-path: api/pnpm-lock.yaml
          install: false

      - name: Check pnpm version
        run: "echo pnpm version: $(pnpm --version)"

      - name: Install dependencies
        working-directory: ./api
        run: pnpm install --frozen-lockfile

      - name: Run type check
        working-directory: ./api
        run: pnpm run type-check

  build:
    needs: [test, lint, type-check]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm + Node
        uses: pnpm/setup@v2
        with:
          version: 11
          runtime: node@22
          cache: true
          cache-dependency-path: api/pnpm-lock.yaml
          install: false

      - name: Install dependencies
        working-directory: ./api
        run: pnpm install --frozen-lockfile

      - name: Build project
        working-directory: ./api
        run: pnpm run build

  build-image:
    needs: [build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./api
          file: ./api/Dockerfile.prod
          push: true
          tags: |
            shop-store:${{ github.sha }}
            shop-store:latest
