name: CI Pipeline
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install PNPM
        run: npm install -g pnpm@9.12.0

      - name: Install Dependencies
        working-directory: ./practice
        run: pnpm install --frozen-lockfile

      - name: Run Test
        working-directory: ./practice
        run: pnpm run test
