name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-typecheck-build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm + Node
        uses: pnpm/setup@v2
        with:
          version: 11
          runtime: node@22
          cache: true
          cache-dependency-path: api/pnpm-lock.yaml
          install: false

      - name: Install dependencies
        working-directory: ./api
        run: pnpm install --frozen-lockfile

      - name: Run type check
        working-directory: ./api
        run: pnpm run type-check

      - name: Run lint
        working-directory: ./api
        run: pnpm run lint

      - name: Build project
        working-directory: ./api
        run: pnpm run build

  build-image:
    needs: [lint-typecheck-build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./api
          file: ./api/Dockerfile.prod
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/shop-store:${{ github.sha }}
            ghcr.io/${{ github.repository }}/shop-store:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [build-image]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    environment: production
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Copy deployment files to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: ${{ secrets.EC2_SSH_PORT }}
          source: "docker-compose.yml,docker-compose.prod.yml,nginx/nginx.conf"
          target: "/home/deployer/app"

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: ${{ secrets.EC2_SSH_PORT }}
          script: |
            cd /home/deployer/app

            cat <<EOF > .env.production
            ${{ secrets.PROD_ENV_FILE }}
            EOF

            chmod 600 .env.production

            export IMAGE=ghcr.io/${{ github.repository }}/shop-store:${{ github.sha }}
            export PORT=3000

            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            # echo "Running database migrations...."
            # docker pull ghcr.io/${{ github.repository }}/shop-store:${{ github.sha }}
            # docker run --rm \
            # --env-file .env.production \
            # --entrypoint node_modules/.bin/drizzle-kit \
            # ghcr.io/${{ github.repository }}/shop-store:${{ github.sha }} \
            # migrate --config ./dist/drizzle.cofig.js
            # if [ $? -ne 0 ]; then
            #   echo "Database migrations failed. Aborting deployment."
            #   exit 1
            # fi
            # echo "Database migrations completed successfully."

            PREVIOUS_IMAGE=$(docker inspect simplenestapp-api-1 --format='{{.Config.Image}}' 2>/dev/null || echo "")

            docker compose -f docker-compose.yml -f docker-compose.prod.yml pull
            docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d

            echo "Waiting for application to become healthy..."

            MAX_RETRIES=10
            RETRY_INTERVAL=5
            SUCCESS=false

            for i in $(seq 1 $MAX_RETRIES); do
              if curl -sf http://localhost:3000/health > /dev/null; then
                echo "Health check passed on attempt $i"
                SUCCESS=true
                break
              fi
              echo "Attempt $i/$MAX_RETRIES failed, retrying in ${RETRY_INTERVAL}s..."
              sleep $RETRY_INTERVAL
            done

            if [ "$SUCCESS" = false ]; then
              echo "Health check failed after $MAX_RETRIES attempts. Deployment considered FAILED."
              echo "--- Recent container logs ---"
              docker logs simplenestapp-api-1 --tail 50
            fi

            echo "Health check failed. Rolling back to: $PREVIOUS_IMAGE"
            if [ -n "$PREVIOUS_IMAGE" ]; then
              export IMAGE=$PREVIOUS_IMAGE
              docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
              echo "Rollback completed. Previous version restored."
            else
              echo "No previous image found — cannot auto-rollback. Manual intervention required."
            fi
              exit 1
            fi

            echo "Deployment verified successfully."
