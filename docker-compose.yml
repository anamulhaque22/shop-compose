name: "Simple Nest App"
services:
  api:
    hostname: shop-api
    restart: unless-stopped
    networks:
      - backend-net
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:${PORT}/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - certbot-webroot:/var/www/certbot
      - certbot-certs:/etc/letsencrypt
    depends_on:
      api:
        condition: service_healthy
    networks:
      - backend-net

networks:
  backend-net:
volumes:
  certbot-webroot:
  certbot-certs:
